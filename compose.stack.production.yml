name: ${COMPOSE_PROJECT_NAME:-mirante-production}

x-geonode-service: &geonode-service
  image: mirante/geonode:5.1.0
  build:
    context: .
    dockerfile: docker/geonode/Dockerfile
    args:
      GEONODE_VERSION: 5.1.0
  env_file:
    - ${MIRANTE_STACK_ENV_FILE:-deploy/stack.production.env}
  restart: unless-stopped
  volumes:
    - static-data:/mnt/volumes/statics/static
    - media-data:/mnt/volumes/statics/uploaded
    - assets-data:/mnt/volumes/statics/assets
    - geoserver-data:/geoserver_data/data
    - backup-data:/backup_restore
    - shared-data:/data
    - temporary-data:/tmp
  networks:
    - geonode

services:
  mirante:
    image: "${MIRANTE_IMAGE:-mirante/frontend}:${MIRANTE_VERSION:-production}"
    build:
      context: .
      dockerfile: docker/mirante/Dockerfile
      target: production
      args:
        MIRANTE_VERSION: "${MIRANTE_VERSION:-0.0.0-dev}"
    environment:
      GEONODE_INTERNAL_URL: https://nginx:443
      MIRANTE_DATASET_UPLOAD_MAX_FILE_SIZE_BYTES: "${MIRANTE_DATASET_UPLOAD_MAX_FILE_SIZE_BYTES:-104857600}"
      MIRANTE_DATASET_UPLOAD_VISIBILITY_CONTROL: "${MIRANTE_DATASET_UPLOAD_VISIBILITY_CONTROL:-true}"
      MIRANTE_GEONODE_BASE_URL: /
      MIRANTE_GEONODE_WEB_URL: "${MIRANTE_PUBLIC_URL:?Set the public Mirante URL}"
      MIRANTE_PROXY_MAX_BODY_SIZE: "${MIRANTE_PROXY_MAX_BODY_SIZE:-110m}"
      MIRANTE_REQUIRE_AUTHENTICATION: "${MIRANTE_REQUIRE_AUTHENTICATION:-false}"
    ports:
      - "127.0.0.1:${MIRANTE_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - geonode

  django:
    <<: *geonode-service
    environment:
      IS_CELERY: "False"
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: ["uwsgi", "--ini", "/usr/src/geonode/uwsgi.ini"]
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://django:8000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  celery:
    <<: *geonode-service
    environment:
      IS_CELERY: "True"
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: ["celery-cmd"]
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[c]elery.*worker'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  nginx:
    image: mirante/geonode-nginx:1.31.2
    build:
      context: https://github.com/GeoNode/geonode-docker.git#cd47f0e18342631b76bd2056867133a3d6798930:docker/nginx
      args:
        NGINX_VERSION: 1.31.2
    env_file:
      - ${MIRANTE_STACK_ENV_FILE:-deploy/stack.production.env}
    environment:
      RESOLVER: 127.0.0.11
    volumes:
      - nginx-certificates:/geonode-certificates
      - static-data:/mnt/volumes/statics/static:ro
      - media-data:/mnt/volumes/statics/uploaded:ro
      - assets-data:/mnt/volumes/statics/assets:ro
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -o pid | grep -q -w 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - geonode

  geoserver:
    image: mirante/geoserver:2.28.4
    build:
      context: https://github.com/GeoNode/geonode-docker.git#cd47f0e18342631b76bd2056867133a3d6798930:docker/geoserver
      args:
        GEOSERVER_VERSION: 2.28.4
    env_file:
      - ${MIRANTE_STACK_ENV_FILE:-deploy/stack.production.env}
    volumes:
      - static-data:/mnt/volumes/statics/static
      - media-data:/mnt/volumes/statics/uploaded
      - geoserver-data:/geoserver_data/data
      - backup-data:/backup_restore
      - shared-data:/data
      - temporary-data:/tmp
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/geoserver/ows",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - geonode

  db:
    image: mirante/geonode-postgis:15-3.5
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    command:
      ["postgres", "-c", "max_connections=${POSTGRESQL_MAX_CONNECTIONS:-200}"]
    env_file:
      - ${MIRANTE_STACK_ENV_FILE:-deploy/stack.production.env}
    volumes:
      - database-data:/var/lib/postgresql/data
      - database-backups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - geonode

  memcached:
    image: mirante/memcached:1.6
    build:
      context: .
      dockerfile: docker/memcached/Dockerfile
    command: ["--memory-limit=64", "--listen=0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - geonode

  redis:
    image: mirante/redis:7.0
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - geonode

networks:
  geonode:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-geonode

volumes:
  assets-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-assets
  backup-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-backup
  database-backups:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-database-backups
  database-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-database
  geoserver-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-geoserver
  media-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-media
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-nginx-certificates
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-redis
  shared-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-shared
  static-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-static
  temporary-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-temporary
