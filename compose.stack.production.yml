name: ${COMPOSE_PROJECT_NAME:-mirante-production}

x-geonode-service: &geonode-service
  image: "${GEONODE_IMAGE:-geonode/geonode}:${GEONODE_VERSION:-5.1.0}"
  env_file:
    - ${MIRANTE_STACK_ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    - static-data:/mnt/volumes/statics/static
    - media-data:/mnt/volumes/statics/uploaded
    - assets-data:/mnt/volumes/statics/assets
    - geoserver-data:/geoserver_data/data
    - backup-data:/backup_restore
    - shared-data:/data
    - temporary-data:/tmp
  networks:
    - geonode

services:
  mirante:
    image: "${MIRANTE_IMAGE:-ghcr.io/barbosaneto/mirante}:${MIRANTE_VERSION:-0.1.2}"
    environment:
      GEONODE_INTERNAL_URL: https://nginx:443
      MIRANTE_DATASET_UPLOAD_MAX_FILE_SIZE_BYTES: "${MIRANTE_DATASET_UPLOAD_MAX_FILE_SIZE_BYTES:-104857600}"
      MIRANTE_DATASET_UPLOAD_VISIBILITY_CONTROL: "${MIRANTE_DATASET_UPLOAD_VISIBILITY_CONTROL:-true}"
      MIRANTE_GEONODE_BASE_URL: /
      MIRANTE_GEONODE_WEB_URL: "${MIRANTE_PUBLIC_URL:?Set the public Mirante URL}"
      MIRANTE_GOOGLE_OIDC_ENABLED: "${MIRANTE_GOOGLE_OIDC_ENABLED:-true}"
      MIRANTE_PROXY_MAX_BODY_SIZE: "${MIRANTE_PROXY_MAX_BODY_SIZE:-210m}"
      MIRANTE_REQUIRE_AUTHENTICATION: "${MIRANTE_REQUIRE_AUTHENTICATION:-false}"
    ports:
      - "127.0.0.1:${MIRANTE_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - geonode

  django:
    <<: *geonode-service
    environment:
      IS_CELERY: "False"
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: ["uwsgi", "--ini", "/usr/src/geonode/uwsgi.ini"]
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://django:8000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  celery:
    <<: *geonode-service
    environment:
      IS_CELERY: "True"
    # Django performs the vanilla initialization. Starting Celery directly
    # prevents the upstream entrypoint from leaving worker processes with a
    # stale .override_env credential.
    entrypoint: ["/bin/bash", "-lc"]
    command: ["exec /usr/bin/celery-cmd"]
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[c]elery.*worker'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  nginx:
    image: "${GEONODE_NGINX_IMAGE:-geonode/nginx}:${GEONODE_NGINX_VERSION:-1.31.2-latest}"
    env_file:
      - ${MIRANTE_STACK_ENV_FILE:-.env}
    environment:
      RESOLVER: 127.0.0.11
    volumes:
      - nginx-certificates:/geonode-certificates
      - static-data:/mnt/volumes/statics/static:ro
      - media-data:/mnt/volumes/statics/uploaded:ro
      - assets-data:/mnt/volumes/statics/assets:ro
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -o pid | grep -q -w 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - geonode

  geoserver:
    image: "${GEOSERVER_IMAGE:-geonode/geoserver}:${GEOSERVER_VERSION:-2.28.4-latest}"
    env_file:
      - ${MIRANTE_STACK_ENV_FILE:-.env}
    volumes:
      - static-data:/mnt/volumes/statics/static
      - media-data:/mnt/volumes/statics/uploaded
      - geoserver-data:/geoserver_data/data
      - backup-data:/backup_restore
      - shared-data:/data
      - temporary-data:/tmp
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/geoserver/ows",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - geonode

  db:
    image: "${POSTGIS_IMAGE:-geonode/postgis}:${POSTGIS_VERSION:-15-3.5-latest}"
    command:
      ["postgres", "-c", "max_connections=${POSTGRESQL_MAX_CONNECTIONS:-200}"]
    env_file:
      - ${MIRANTE_STACK_ENV_FILE:-.env}
    volumes:
      - database-data:/var/lib/postgresql/data
      - database-backups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - geonode

  memcached:
    image: "${MEMCACHED_IMAGE:-memcached}:${MEMCACHED_VERSION:-1.6-alpine}"
    command: ["--memory-limit=64", "--listen=0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - geonode

  redis:
    image: "${REDIS_IMAGE:-redis}:${REDIS_VERSION:-7-alpine}"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - geonode

networks:
  geonode:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-geonode

volumes:
  assets-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-assets
  backup-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-backup
  database-backups:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-database-backups
  database-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-database
  geoserver-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-geoserver
  media-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-media
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-nginx-certificates
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-redis
  shared-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-shared
  static-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-static
  temporary-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante-production}-temporary
