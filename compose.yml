name: ${COMPOSE_PROJECT_NAME:-mirante}

x-geonode-service: &geonode-service
  image: mirante/geonode:5.1.0
  build:
    context: .
    dockerfile: docker/geonode/Dockerfile
    args:
      GEONODE_VERSION: 5.1.0
  env_file:
    - ${COMPOSE_ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    - static-data:/mnt/volumes/statics/static
    - media-data:/mnt/volumes/statics/uploaded
    - assets-data:/mnt/volumes/statics/assets
    - geoserver-data:/geoserver_data/data
    - backup-data:/backup_restore
    - shared-data:/data
    - temporary-data:/tmp
  networks:
    - geonode

services:
  mirante:
    image: mirante/frontend:development
    build:
      context: .
      dockerfile: docker/mirante/Dockerfile
    environment:
      GEONODE_INTERNAL_URL: http://nginx
      MIRANTE_USE_POLLING: "true"
      VITE_GEONODE_BASE_URL: /
    ports:
      - "${MIRANTE_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - mirante-dependencies:/workspace/node_modules
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - geonode

  django:
    <<: *geonode-service
    environment:
      IS_CELERY: "False"
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: ["uwsgi", "--ini", "/usr/src/geonode/uwsgi.ini"]
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://django:8000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  celery:
    <<: *geonode-service
    environment:
      IS_CELERY: "True"
    entrypoint: ["/usr/src/geonode/entrypoint.sh"]
    command: ["celery-cmd"]
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[c]elery.*worker'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  nginx:
    image: mirante/geonode-nginx:1.31.2
    build:
      context: https://github.com/GeoNode/geonode-docker.git#cd47f0e18342631b76bd2056867133a3d6798930:docker/nginx
      args:
        NGINX_VERSION: 1.31.2
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    environment:
      RESOLVER: 127.0.0.11
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - nginx-configuration:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - static-data:/mnt/volumes/statics/static:ro
      - media-data:/mnt/volumes/statics/uploaded:ro
      - assets-data:/mnt/volumes/statics/assets:ro
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -o pid | grep -q -w 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - geonode

  geoserver:
    image: mirante/geoserver:2.28.4
    build:
      context: https://github.com/GeoNode/geonode-docker.git#cd47f0e18342631b76bd2056867133a3d6798930:docker/geoserver
      args:
        GEOSERVER_VERSION: 2.28.4
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - static-data:/mnt/volumes/statics/static
      - media-data:/mnt/volumes/statics/uploaded
      - geoserver-data:/geoserver_data/data
      - backup-data:/backup_restore
      - shared-data:/data
      - temporary-data:/tmp
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/geoserver/ows",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - geonode

  db:
    image: mirante/geonode-postgis:15-3.5
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    command:
      ["postgres", "-c", "max_connections=${POSTGRESQL_MAX_CONNECTIONS:-200}"]
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    volumes:
      - database-data:/var/lib/postgresql/data
      - database-backups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - geonode

  memcached:
    image: mirante/memcached:1.6
    build:
      context: .
      dockerfile: docker/memcached/Dockerfile
    command: ["--memory-limit=64", "--listen=0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - geonode

  redis:
    image: mirante/redis:7.0
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
      ]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - geonode

networks:
  geonode:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-geonode

volumes:
  assets-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-assets
  backup-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-backup
  database-backups:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-database-backups
  database-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-database
  geoserver-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-geoserver
  media-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-media
  mirante-dependencies:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-dependencies
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-nginx-certificates
  nginx-configuration:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-nginx-configuration
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-redis
  shared-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-shared
  static-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-static
  temporary-data:
    name: ${COMPOSE_PROJECT_NAME:-mirante}-temporary
