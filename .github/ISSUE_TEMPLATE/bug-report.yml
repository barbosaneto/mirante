name: Bug report
description: Report a reproducible problem in Mirante
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Search existing issues first and remove credentials, cookies, tokens, private data, and secrets from every field and attachment. Security vulnerabilities must be reported through SECURITY.md instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I confirmed that this is not a security vulnerability.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
  - type: input
    id: mirante-version
    attributes:
      label: Mirante version
      description: Provide a release, tag, or commit hash.
      placeholder: 0.x.y or abc1234
    validations:
      required: true
  - type: input
    id: geonode-version
    attributes:
      label: GeoNode version
      placeholder: 5.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, deployment method, and host architecture when relevant.
      placeholder: Firefox 142, Ubuntu 24.04, Docker Compose, linux/amd64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that consistently reproduces the problem.
      placeholder: |
        1. Sign in as a user with ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: geonode-direct
    attributes:
      label: Does the problem also occur directly in GeoNode?
      options:
        - Not tested
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Attach only information that contains no secrets or private data.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
