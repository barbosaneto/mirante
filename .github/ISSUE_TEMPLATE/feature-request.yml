name: Feature request
description: Propose a focused improvement to Mirante
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need before proposing an implementation. Large architectural, dependency, or public SDK changes should explain their effect on institutional distributions and vanilla GeoNode compatibility.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: This request belongs in Mirante rather than GeoNode or GeoServer.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Who needs this and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only a technical solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and extension impact
      description: Note GeoNode APIs, permissions, translations, public SDK contracts, theming, or deployment changes.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
