name: ${COMPOSE_PROJECT_NAME:-mirante-production}

services:
  mirante:
    image: "${MIRANTE_IMAGE:-mirante/frontend}:${MIRANTE_VERSION:-production}"
    build:
      context: .
      dockerfile: docker/mirante/Dockerfile
      target: production
      args:
        MIRANTE_VERSION: "${MIRANTE_VERSION:-0.0.0-dev}"
    environment:
      GEONODE_INTERNAL_URL: "${GEONODE_INTERNAL_URL:?Set the private GeoNode origin}"
      MIRANTE_DATASET_UPLOAD_MAX_FILE_SIZE_BYTES: "${MIRANTE_DATASET_UPLOAD_MAX_FILE_SIZE_BYTES:-104857600}"
      MIRANTE_DATASET_UPLOAD_VISIBILITY_CONTROL: "${MIRANTE_DATASET_UPLOAD_VISIBILITY_CONTROL:-true}"
      MIRANTE_GEONODE_BASE_URL: "${MIRANTE_GEONODE_BASE_URL:-/}"
      MIRANTE_GEONODE_WEB_URL: "${MIRANTE_GEONODE_WEB_URL:?Set the public GeoNode origin}"
      MIRANTE_PROXY_MAX_BODY_SIZE: "${MIRANTE_PROXY_MAX_BODY_SIZE:-110m}"
      MIRANTE_REQUIRE_AUTHENTICATION: "${MIRANTE_REQUIRE_AUTHENTICATION:-false}"
    ports:
      - "127.0.0.1:${MIRANTE_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
