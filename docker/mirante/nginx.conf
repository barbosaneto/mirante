worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

  map $http_x_forwarded_proto $mirante_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
  }

  map $http_x_forwarded_port $mirante_forwarded_port {
    "" $server_port;
    default $http_x_forwarded_port;
  }

  include /tmp/mirante.conf;
}
